services:
  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=community
      - POSTGRES_PASSWORD=community_dev_password
      - POSTGRES_DB=community
    volumes:
      - pgdata:/var/lib/postgresql
      - ./backend/infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U community" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:8.8.0-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  rabbitmq:
    image: docker.io/library/rabbitmq:4.3-management
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=community
      - RABBITMQ_DEFAULT_PASS=community_dev_password
    volumes:
      - mqdata:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector:0.154.0
    restart: unless-stopped
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:latest
    command: "-target=all -config.file=/etc/tempo.yaml"
    restart: unless-stopped
    volumes:
      - ./otel/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ./otel/prometheus.yml:/etc/prometheus.yml
    depends_on:
      - otel-collector

  openfga-migrate:
    image: docker.io/openfga/openfga:latest
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://openfga:openfga_dev_password@db:5432/community?sslmode=disable
    command: migrate
    depends_on:
      db:
        condition: service_healthy

  openfga:
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    image: docker.io/openfga/openfga:latest
    command: run
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://openfga:openfga_dev_password@db:5432/community?sslmode=disable
      - OPENFGA_DATASTORE_MAX_OPEN_CONNS=20
      - OPENFGA_PLAYGROUND_ENABLED=false
      - OPENFGA_TRACE_ENABLED=true
      - OPENFGA_TRACE_OTLP_ENDPOINT=otel-collector:4317
      - OPENFGA_TRACE_SAMPLE_RATIO=1
      - OPENFGA_CACHE_ENABLED=true
      - OPENFGA_CACHE_TTL=60s
      - OPENFGA_CACHE_MAX_SIZE=10000
    healthcheck:
      test: [ "CMD", "/usr/local/bin/grpc_health_probe", "-addr=openfga:8081" ]
      interval: 5s
      timeout: 30s
      retries: 3

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./otel/grafana/provisioning/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./otel/grafana/provisioning/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
    depends_on:
      - tempo

volumes:
  pgdata:
  redisdata:
  mqdata:
  grafana-data:
  tempo-data:
