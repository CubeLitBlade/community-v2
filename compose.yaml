version: '3.8'

services:
  db:
    image: docker.io/library/postgres:18-alpine
    container_name: community-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=community
      - POSTGRES_PASSWORD=community_dev_password
      - POSTGRES_DB=community
    volumes:
      - pgdata:/var/lib/postgresql

  rabbitmq:
    image: docker.io/library/rabbitmq:4.3-management
    container_name: community-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=community
      - RABBITMQ_DEFAULT_PASS=community_dev_password
    volumes:
      - mqdata:/var/lib/rabbitmq

volumes:
  pgdata:
  mqdata:
