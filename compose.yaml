services:
  db:
    image: docker.io/library/postgres:18-alpine
    container_name: community-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=community
      - POSTGRES_PASSWORD=community_dev_password
      - POSTGRES_DB=community
    volumes:
      - pgdata:/var/lib/postgresql
      - ./backend/infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U community" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:8.8.0-alpine
    container_name: community-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data

  rabbitmq:
    image: docker.io/library/rabbitmq:4.3-management
    container_name: community-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=community
      - RABBITMQ_DEFAULT_PASS=community_dev_password
    volumes:
      - mqdata:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.19.0
    container_name: community-jaeger
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "13133" ]
      interval: 10s
      timeout: 3s
      retries: 5

  openfga-migrate:
    image: docker.io/openfga/openfga:latest
    container_name: community-openfga-migrate
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://openfga:openfga_dev_password@db:5432/community?sslmode=disable
    command: migrate
    depends_on:
      db:
        condition: service_healthy

  openfga:
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
      jaeger:
        condition: service_healthy
    image: docker.io/openfga/openfga:latest
    container_name: community-openfga
    command: run
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://openfga:openfga_dev_password@db:5432/community?sslmode=disable
      - OPENFGA_DATASTORE_MAX_OPEN_CONNS=20
      - OPENFGA_PLAYGROUND_ENABLED=false
      - OPENFGA_TRACE_ENABLED=true
      - OPENFGA_TRACE_OTLP_ENDPOINT=jaeger:4317
      - OPENFGA_TRACE_SAMPLE_RATIO=1
      - OPENFGA_CACHE_ENABLED=true
      - OPENFGA_CACHE_TTL=60s
      - OPENFGA_CACHE_MAX_SIZE=10000
    healthcheck:
      test: [ "CMD", "/usr/local/bin/grpc_health_probe", "-addr=openfga:8081" ]
      interval: 5s
      timeout: 30s
      retries: 3

volumes:
  pgdata:
  redisdata:
  mqdata:

