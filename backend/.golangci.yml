version: '2'

run:
  timeout: 5m
  tests: true
  relative-path-mode: gomod
  modules-download-mode: readonly
  issues-exit-code: 1
  allow-parallel-runners: false

linters: 
  default: standard

  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - nilnil
    - nilerr
    - errorlint
    - contextcheck
    - noctx
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - gocritic
    - revive
    - unparam
    - unconvert
    - prealloc
    - predeclared
    - durationcheck
    - depguard
    - errchkjson
    - exhaustruct
    - nolintlint
    - reassign
    - paralleltest
    - varnamelen
    - misspell
    - errname 
    - fatcontext 
    - intrange
    - wastedassign
    - modernize
    - usetesting
    - canonicalheader
    - perfsprint
    - containedctx
    - thelper
    - gocheckcompilerdirectives
    - iotamixing
    - asasalint
    - usestdlibvars
    - unqueryvet
    - gomoddirectives
    - nosprintfhostport
    - nilnesserr
    - tagliatelle
    - exhaustive
    - musttag
    - wrapcheck
    - funlen
    - cyclop
    - nestif
    - forcetypeassert
    - nakedret
    - err113
    - recvcheck
    - embeddedstructfieldcheck
    - grouper
    - goconst
    - mnd
    - importas
    - sloglint
    - whitespace
    - wastedassign
    - wsl_v5
  
  exclusions:
    generated: lax
    warn-unused: true
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      - path: ent
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - funlen
          - exhaustruct
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - funlen
          - exhaustruct
          - varnamelen
      - path-except: _test\.go
        linters:
          - forbidigo
  
  settings:
    depguard:
      rules:
        main:
          list-mode: strict
          files:
            - '$all'
          allow:
            - '$gostd'
            - 'github.com/cubelitblade/community-v2/backend'
            - 'github.com/gin-gonic/gin'
            - 'github.com/gorilla/csrf'
            - 'golang.org/x/crypto/bcrypt'
            - 'github.com/golang-jwt/jwt/v5'
            - 'gorm.io/gorm'
            - 'gorm.io/driver/postgres'
            - 'go.uber.org/fx'
            - 'gorm.io/cli/gorm/field'
            - 'github.com/rabbitmq/rabbitmq-amqp-go-client/pkg/rabbitmqamqp'
            - 'github.com/Azure/go-amqp'
            - 'github.com/cloudevents/sdk-go/v2'
            - 'github.com/lmittmann/tint'
            - 'github.com/openfga/go-sdk/client'
            - 'github.com/knadh/koanf/v2'
            - 'github.com/knadh/koanf/providers/file'
            - 'github.com/knadh/koanf/parsers/toml/v2'
            - 'github.com/knadh/koanf/providers/env/v2'
            - 'github.com/go-playground/validator/v10'
            - 'github.com/stretchr/testify/assert'
            - 'github.com/stretchr/testify/require'
            - 'entgo.io/ent'
            - 'github.com/mattn/go-sqlite3'
            - 'github.com/jackc/pgx/v5/stdlib'
            - 'github.com/pressly/goose/v3'
            - 'github.com/testcontainers/testcontainers-go'
            - 'google.golang.org/grpc'
            - 'go.opentelemetry.io/otel'
            - 'go.opentelemetry.io/otel/trace'
            - 'go.opentelemetry.io/otel/sdk/trace'
            - 'go.opentelemetry.io/otel/semconv/v1.41.0'
            - 'go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc'
            - 'github.com/bytedance/sonic'
            - 'github.com/openfga/api/proto/openfga/v1'
            - 'github.com/XSAM/otelsql'
            - 'github.com/redis/go-redis/v9'
            - 'github.com/redis/go-redis/extra/redisotel-native/v9'

    errcheck:
      check-type-assertions: true
      check-blank: true
      disable-default-exclusions: false
    
    
    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true
    
    exhaustruct:
      include:
        - 'github.com/cubelitblade/community-v2/backend/pkg/.*'
        - 'github.com/cubelitblade/community-v2/backend/services/.*'
      exclude:
        - 'gorm.io/gorm.Config'
        - 'net/http.Client'
        - 'net/http.Transport'
      allow-empty: true

    gosec:
      excludes:
        - G104 
        - G404 

    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        - paramTypeCombine
    
    revive:
      severity: error
      confidence: 0.8
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: line-length-limit
          arguments: [120]
    
    nolintlint:
      allow-unused: false
      allow-no-explanation: []
      require-explanation: true
      require-specific: true
  
    nilnil:
      only-two: false
      detect-opposite: true
    
    reassign:
      patterns:
        - '.*'

    cyclop:
      max-complexity: 10

    funlen:
      lines: 80
      statements: 50

    nestif:
      min-complexity: 4
    
    exhaustive:
      default-signifies-exhaustive: true

    gomoddirectives:
      replace-local: true

    goconst:
      min-occurrences: 4

    mnd:
      ignored-numbers:
        - '0'
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
    
    varnamelen:
      ignore-names:
        - tt
        - tc
        - id
        - fc
        - fn
      ignore-decls:
        - c echo.Context
        - t testing.T
        - f *foo.Bar
        - e error
        - i int
        - const C
        - T any
        - m map[string]int
        - r *http.Request
        - w http.ResponseWriter
        - c *gin.Context
        - db *sql.DB 
        - db *gorm.DB
        - tx *gorm.DB
        - tx *ent.Tx
        - tt *testing.T
        - tc TestCase
        - lc fx.Lifecycle
        - err error
        - ok bool
        - k *koanf.Koanf
        - p redis.Pipeliner

    sloglint:
      no-global: 'all'
      context: 'scope'
      static-msg: true
      msg-style: 'lowercased'
      key-naming-case: 'snake'
      attr-only: true
      args-on-sep-lines: true

formatters:
  enable:
    - gofumpt
    - gci

  exclusions:
    generated: strict
    warn-unused: true

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/cubelitblade/community-v2/backend)

issues:
  max-issues-per-linter: 50  
  max-same-issues: 10
  uniq-by-line: false

severity:
  default: error