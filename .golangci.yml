version: "2"

run:
  timeout: 5m
  tests: true
  relative-path-mode: gomod
  modules-download-mode: readonly
  issues-exit-code: 1
  allow-parallel-runners: false

linters: 
  default: standard

  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - nilnil
    - nilerr
    - errorlint
    - contextcheck
    - noctx
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - gocritic
    - revive
    - unparam
    - unconvert
    - prealloc
    - predeclared
    - durationcheck
    - depguard
    - errchkjson
    - exhaustruct
    - nolintlint
    - reassign
    - paralleltest
    - varnamelen
    - misspell
    - errname 
    - fatcontext 
    - intrange
    - wastedassign
    - modernize
    - usetesting
    - canonicalheader
    - perfsprint
    - containedctx
    - thelper
    - gocheckcompilerdirectives
    - iotamixing
    - asasalint
    - usestdlibvars
    - unqueryvet
    - gomoddirectives
    - nosprintfhostport
    - nilnesserr
    - tagliatelle
    - exhaustive
    - musttag
    - wrapcheck
    - funlen
    - cyclop
    - nestif
    - forcetypeassert
    - nakedret
    - err113
    - recvcheck
    - embeddedstructfieldcheck
    - grouper
    - goconst
    - mnd
    - importas
    - sloglint
    - whitespace
    - wastedassign
    - wsl_v5
  
  exclusions:
    generated: strict
    warn-unused: true
  
  settings:
    depguard:
      rules:
        main:
          list-mode: strict
          files:
            - "$all"
          allow:
            - "$gostd"
            - "github.com/cubelitblade/community-v2/backend"
            - "github.com/caarlos0/env"
            - "github.com/gin-gonic/gin"
            - "github.com/gorilla/csrf"
            - "golang.org/x/crypto/bcrypt"
            - "github.com/golang-jwt/jwt/v5"
            - "gorm.io/gorm"
            - "gorm.io/driver/postgres"
            - "go.uber.org/fx"
            - "gorm.io/cli/gorm/field"
            - "github.com/rabbitmq/rabbitmq-amqp-go-client/pkg/rabbitmqamqp"
            - "github.com/Azure/go-amqp"
            - "github.com/cloudevents/sdk-go/v2"
            - "github.com/lmittmann/tint"

    errcheck:
      check-type-assertions: true
      check-blank: true
      disable-default-exclusions: false
    
    
    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true
    
    exhaustruct:
      include:
        - 'github.com/cubelitblade/community-v2/backend/pkg/.*'
        - 'github.com/cubelitblade/community-v2/backend/services/.*'
      exclude:
        - 'gorm.io/gorm.Config'
        - 'net/http.Client'
        - 'net/http.Transport'

    gosec:
      excludes:
        - G104 
        - G404 

    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        - paramTypeCombine
    
    revive:
      severity: error
      confidence: 0.8
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: unnecessary-stmt
    
    nolintlint:
      allow-unused: false
      allow-no-explanation: []
      require-explanation: true
      require-specific: true
  
    nilnil:
      only-two: false
      detect-opposite: true
    
    reassign:
      patterns:
        - ".*"

    cyclop:
      max-complexity: 10

    funlen:
      lines: 80
      statements: 50

    nestif:
      min-complexity: 4
    
    exhaustive:
      default-signifies-exhaustive: true

    gomoddirectives:
      replace-local: true

    goconst:
      min-occurrences: 4

    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
    
    varnamelen:
      ignore-names:
        - tt
        - tc
        - id
      ignore-decls:
        - c echo.Context
        - t testing.T
        - f *foo.Bar
        - e error
        - i int
        - const C
        - T any
        - m map[string]int
        - r *http.Request
        - w http.ResponseWriter
        - c *gin.Context 
        - db *gorm.DB
        - tx *gorm.DB
        - tt *testing.T
        - tc TestCase
        - lc fx.Lifecycle
        - err error
        - ok bool

    sloglint:
      no-global: "all"
      context: "scope"
      static-msg: true
      msg-style: "lowercased"
      key-naming-case: "snake"
      attr-only: true
      args-on-sep-lines: true

formatters:
  enable:
    - gofumpt
    - gci

  exclusions:
    generated: strict
    warn-unused: true

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/CubeLitBlade/community-v2/backend)

issues:
  max-issues-per-linter: 50  
  max-same-issues: 10
  uniq-by-line: false

severity:
  default: error